[package]
name = "grip-app"
description = "Grip: Rust + Tauri desktop controller for Razer peripherals"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
secbird-core = { path = "../secbird-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12.7", features = ["tray-icon"] }
